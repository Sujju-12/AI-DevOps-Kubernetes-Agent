apiVersion: v1
kind: Namespace
metadata:
  name: demo-oom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-app
  namespace: demo-oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-app
  template:
    metadata:
      labels:
        app: oom-app
    spec:
      containers:
        - name: stress
          image: polinux/stress
          args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi

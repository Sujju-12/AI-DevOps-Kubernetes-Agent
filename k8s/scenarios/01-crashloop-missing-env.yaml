apiVersion: v1
kind: Namespace
metadata:
  name: demo-crashloop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-env-app
  namespace: demo-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-env
  template:
    metadata:
      labels:
        app: missing-env
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "FATAL: DATABASE_URL environment variable is missing"
              exit 1

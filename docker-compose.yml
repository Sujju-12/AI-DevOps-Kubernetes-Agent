version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      KUBECONFIG: /kube/config
      KUBECONFIG_PATH: /kube/config
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_PROVIDER: local
      AUTH_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_PATH: /app/data/agent.db
    volumes:
      # Directory mount so Compose starts even when kubeconfig is missing.
      # WSL: copy Windows config to ~/.kube/config, or set KUBECONFIG_HOST_DIR.
      - ${KUBECONFIG_HOST_DIR:-${HOME}/.kube}:/kube:ro
      - agent-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  agent-data:
